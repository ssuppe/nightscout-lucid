# Standalone Docker Compose for Nightscout Lucid
# Allows hosting the Dexcom Clarity style dashboard independently at http://localhost:8120/
services:
  clarity:
    build:
      context: .
      args:
        - VITE_BASE=/
    ports:
      - "8120:80"
    environment:
      # Optional: runtime credentials for Nurse Access Code feature
      - NURSE_ACCESS_CODE=${NURSE_ACCESS_CODE:-}
      - NURSE_NIGHTSCOUT_URL=${NURSE_NIGHTSCOUT_URL:-}
      - NURSE_NIGHTSCOUT_TOKEN=${NURSE_NIGHTSCOUT_TOKEN:-}
    restart: unless-stopped
