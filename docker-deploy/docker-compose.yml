# Standalone Docker Compose for Nightscout Lucid
# Allows hosting the Dexcom Clarity style dashboard independently at http://localhost:8120/

services:

  nightscout-lucid:
    build:
      # Set context for project (parent directory, needed for build sources)
      context: ../

      # Set path to Dockerfile (relative to context)
      dockerfile: ./docker-deploy/Dockerfile
      args:
        - VITE_BASE=/

    image: 'nightscout-lucid:latest'                          # Local image
    image: '<image_repositoryname>/nightscout-lucid:latest'   # Image repository 
    pull_policy: if_not_present                               # Optional

    container_name: nightscout-lucid
    environment:
      - TZ=Europe/Amsterdam
    env_file:
      - path: ./nightscout-lucid.env
        required: true                          # default
    ports:
      - '8120:80'                               # Map local port 80 (docker app) to 8120 (host)

    restart: unless-stopped

    volumes:
      # Mounte extern Caddyfile on container instance
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro


