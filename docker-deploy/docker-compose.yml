# Standalone Docker Compose for Nightscout Lucid
# Host the Dexcom Clarity style dashboard independently at http://localhost:8120/

services:

  nightscout-lucid:
    image: 'ghcr.io/ssuppe/nightscout-lucid:latest'
    container_name: nightscout-lucid
    pull_policy: if_not_present
    environment:
      - TZ=Europe/Amsterdam
    env_file:
      - path: ./nightscout-lucid.env
        required: true
    ports:
      - '8120:80'
    restart: unless-stopped
